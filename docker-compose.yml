services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prior-auth-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: prior_auth
      DB_USERNAME: priorauth
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - prior-auth-net

  nginx:
    image: nginx:1.27-alpine
    container_name: prior-auth-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - prior-auth-net

  mysql:
    image: mysql:8.4
    container_name: prior-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prior_auth
      MYSQL_USER: priorauth
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - prior_auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - prior-auth-net

  redis:
    image: redis:7-alpine
    container_name: prior-auth-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - prior-auth-net

volumes:
  prior_auth_mysql_data:

networks:
  prior-auth-net:
    driver: bridge
